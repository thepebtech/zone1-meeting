<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Abuja Zone 1 Partner Meeting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F1; --ink:#14302E; --muted:#4F6663; --btn:#14302E; --btn-ink:#F3F7F6; --ring:#2F8F83;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0F1D1C;--ink:#E6EFEE;--muted:#9DB3B0;--btn:#E6EFEE;--btn-ink:#0F1D1C;--ring:#5CC7B8;}
}
:root[data-theme="dark"]{--bg:#0F1D1C;--ink:#E6EFEE;--muted:#9DB3B0;--btn:#E6EFEE;--btn-ink:#0F1D1C;--ring:#5CC7B8;}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;width:100%;max-width:100%;overflow:hidden}
html{height:100%}
body{height:100vh;height:100dvh}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
main{width:100%;max-width:640px;min-width:0;text-align:left}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(1.6rem,6vw,3.2rem);line-height:1.1;margin:0 0 12px;overflow-wrap:break-word;letter-spacing:-0.02em}
p{font-size:1rem;line-height:1.5;color:var(--muted);margin:0 0 24px;max-width:46ch}
a.join{display:flex;align-items:center;justify-content:center;height:clamp(110px,22vh,200px);width:100%;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(1.5rem,5.5vw,2.6rem);text-align:center;padding:0 16px;border-radius:20px;transition:transform .15s ease}
a.join:hover{transform:scale(1.015)}
a.join:active{transform:scale(.99)}
a.join:focus-visible{outline:4px solid var(--ring);outline-offset:4px}
small{display:block;margin-top:18px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){a.join{transition:none}}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="f89a00e8-da88-4f39-93d3-cd7246fbd7a7"></script>
</head>
<body>
<main>
  <h1>Dear Partner,</h1>
<h2>Abuja Zone 1 warmly welcomes you to our Special Partner Prayers.</h2>
<p>Join us for a powerful time of prayer, fellowship, and spiritual refreshing.</p>
  <p>Press the button below to enter the meeting.</p>
  <a class="join" id="join" data-umami-event="join-meeting" href="https://vcpout-sf01-altnetro.internetmultimediaonline.org/vcp/a5f16fdd/playlist.m3u8" target="_blank" rel="noopener noreferrer">Join the meeting</a>
</main>
</body>
</html>
