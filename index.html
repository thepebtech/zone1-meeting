<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Abuja Zone 1 Partner Meeting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500&display=swap">
<style>
:root{--ink:#EAF4F1;--muted:#B9D2CC;--btn:#EAF4F1;--btn-ink:#0B2A25;--ring:#7FE0CF;--line:rgba(234,244,241,.45)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;color:var(--ink);font-family:Inter,system-ui,sans-serif;
  background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url("background.jpg") center/cover no-repeat,#0B2A25;
  display:flex;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
main{width:100%;max-width:640px;min-width:0}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(1.6rem,6vw,3.2rem);line-height:1.1;margin:0 0 12px;letter-spacing:-0.02em;overflow-wrap:break-word}
p{font-size:1rem;line-height:1.5;color:var(--muted);margin:0 0 24px;max-width:46ch}
a.join{display:flex;align-items:center;justify-content:center;height:clamp(110px,22vh,200px);width:100%;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(1.5rem,5.5vw,2.6rem);text-align:center;padding:0 16px;border-radius:20px;transition:transform .15s ease}
a.join:hover{transform:scale(1.015)}
a.join:active{transform:scale(.99)}
.toggle{margin-top:16px;background:none;border:1px solid var(--line);color:var(--ink);font:500 .95rem Inter,system-ui,sans-serif;padding:10px 18px;border-radius:999px;cursor:pointer}
.toggle:hover{background:rgba(255,255,255,.08)}
#panel{display:none;margin-top:14px}
#panel.open{display:block}
input,textarea{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical;min-height:84px}
.send{background:var(--btn);color:var(--btn-ink);border:0;font:600 1rem Inter,system-ui,sans-serif;padding:11px 22px;border-radius:12px;cursor:pointer}
.send:disabled{opacity:.6;cursor:default}
#list{list-style:none;margin:0 0 12px;padding:10px 12px;max-height:28vh;overflow-y:auto;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;font-size:.95rem;line-height:1.45}
#list li{padding:6px 0;border-bottom:1px solid rgba(234,244,241,.15);overflow-wrap:anywhere}
#list li:last-child{border-bottom:0}
#list .empty{color:var(--muted)}
#msg{margin:10px 0 0;font-size:.95rem;color:var(--ink)}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
a.join:focus-visible,.toggle:focus-visible,.send:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
@media (prefers-reduced-motion:reduce){a.join{transition:none}}
</style>
<script defer src="https://cloud.umami.is/script.js" data-website-id="f89a00e8-da88-4f39-93d3-cd7246fbd7a7"></script>
</head>
<body>
<main>
  <h1>Dear Partners, Abuja Zone 1 Welcomes you</h1>
  <p>Press the button below to enter the meeting.</p>
  <a class="join" id="join" data-umami-event="join-meeting" href="https://vcpout-sf01-altnetro.internetmultimediaonline.org/vcp/a5f16fdd/playlist.m3u8" target="_blank" rel="noopener noreferrer">Join the meeting</a>

  <button class="toggle" id="toggle" type="button" aria-expanded="false" aria-controls="panel">Live comments</button>
  <div id="panel">
    <ul id="list" aria-live="polite"><li class="empty">No comments yet. Be the first.</li></ul>
    <form id="cform">
      <input type="text" id="name" maxlength="40" placeholder="Your name (optional)" autocomplete="name">
      <textarea id="text" maxlength="300" placeholder="Write your comment here" required></textarea>
      <button class="send" id="send" type="submit" data-umami-event="send-comment">Send</button>
      <p id="msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Paste your Firebase config here (see setup steps)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

const t=document.getElementById("toggle"),p=document.getElementById("panel"),list=document.getElementById("list"),
      f=document.getElementById("cform"),b=document.getElementById("send"),m=document.getElementById("msg");
t.addEventListener("click",()=>{const o=p.classList.toggle("open");t.setAttribute("aria-expanded",o)});

let col=null;
try{
  const db=getFirestore(initializeApp(firebaseConfig));
  col=collection(db,"comments");
  onSnapshot(query(col,orderBy("createdAt","desc"),limit(100)),snap=>{
    list.textContent="";
    if(snap.empty){const li=document.createElement("li");li.className="empty";li.textContent="No comments yet. Be the first.";list.appendChild(li);return;}
    snap.forEach(d=>{
      const c=d.data(),li=document.createElement("li"),n=document.createElement("strong");
      n.textContent=(c.name||"Guest")+": ";
      li.appendChild(n);li.appendChild(document.createTextNode(c.text||""));
      list.appendChild(li);
    });
  },()=>{m.textContent="Comments could not be loaded right now."});
}catch(e){m.textContent="Comments are not available right now."}

let last=0;
f.addEventListener("submit",async e=>{
  e.preventDefault();
  const text=document.getElementById("text").value.trim(),name=document.getElementById("name").value.trim();
  if(!col||!text)return;
  if(Date.now()-last<5000){m.textContent="Please wait a few seconds before sending another.";return;}
  b.disabled=true;m.textContent="Sending...";
  try{
    await addDoc(col,{name:name.slice(0,40),text:text.slice(0,300),createdAt:serverTimestamp()});
    last=Date.now();document.getElementById("text").value="";m.textContent="Sent.";
  }catch(err){m.textContent="Sorry, it didn't send. Please try again."}
  b.disabled=false;
});
</script>
</body>
</html>
